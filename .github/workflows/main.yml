name: build-1300d
on:
  workflow_dispatch:
  push:
    branches: ["1300d_take_2"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3 python3-docutils zip git mercurial pkg-config

      - name: Build platform 1300D.120 (default goal -> build/magiclantern.zip)
        continue-on-error: true
        run: |
          cd platform/1300D.120
          make SHELL=/bin/bash -j"$(nproc)" 2>&1 | tee /tmp/platform.log | tail -n 60

      - name: Build installer 1300D.120
        continue-on-error: true
        run: |
          cd installer/1300D.120
          make SHELL=/bin/bash 2>&1 | tee /tmp/installer.log | tail -n 60

      - name: Show result
        if: always()
        run: |
          echo "=== platform.log: errors ==="; grep -nE "error|Error|\*\*\*" /tmp/platform.log | head -n 30 || true
          echo "=== platform.log tail ==="; tail -n 15 /tmp/platform.log | cut -c1-240 || true
          echo "=== installer.log errors ==="; grep -nE "error|Error|\*\*\*" /tmp/installer.log | head -n 20 || true
          echo "=== produced files ==="
          find platform/1300D.120 installer/1300D.120 \( -iname '*.fir' -o -iname '*.zip' -o -name 'autoexec.bin' -o -name 'magiclantern.bin' \) | head -n 40 || true

      - name: Pack
        if: always()
        run: |
          mkdir -p out
          find platform/1300D.120 installer/1300D.120 \( -iname '*.fir' -o -iname '*.zip' -o -name 'autoexec.bin' -o -name 'magiclantern.bin' \) -type f -exec cp {} out/ \; || true
          cp /tmp/platform.log /tmp/installer.log out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-1300D-120-simplified
          path: out/
